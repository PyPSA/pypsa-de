              2050: 0              


KN2045_Mix_HDD_pseudo_foresight: #HDD = HighDecentralDiscount nur mit max. Kapazitäten von 2045, um perfect foresight zu approximieren
  costs:
    custom_cost_fn: data/pypsa-de/custom_costs_nep_2023_high_decentral_discount.csv  
  
  solving:
    constraints:
      limits_capacity_max: 
        Link:
          "urban central gas CHP": # from run highDecentralDiscount, 2045-capacities as upper limit to approximate perfect foresight
            DE:
              2030: 15.04
              2035: 15.04
              2040: 15.04
              2045: 15.04
              2050: 15.04
        Generator: 
          CCGT:
            DE:
              2030: 11.04
              2035: 11.04
              2040: 11.04
              2045: 11.04
              2050: 11.04
          OCGT:
            DE:
              2030: 0.31
              2035: 0.31
              2040: 0.31
              2045: 0.31
              2050: 0.31


KN2045_Mix_no_H2_Force_Upstream:

  electricity:
    H2_plants:
      enable: false # allowed values: false, DE, EU
      start: 2030 # should be < force
      force: 2055
      cost_factor: 0.15 # repurposing cost of OCGT gas to H2 in % investment cost in EUR/MW source: Christidis et al (2023) - H2-Ready-Gaskraftwerke, Table 3 https://reiner-lemoine-institut.de/wp-content/uploads/2023/11/RLI-Studie-H2-ready_DE.pdf
      efficiency_loss: 0.05

KN2045_Elek:
# Fokus auf dem Hochlauf von Technologien zur direkten Elektrifizierung der Sektoren
# Strom als präferierter Energieträger in der Endenergie, andere Energieträger ergänzend, wo nötig (Wasserstoff, synthetische Kraftstoffe)
# Ausbau der erneuerbaren Stromerzeugung erreicht politisch gesetzte Ziele
# Importe erneuerbar erzeugter Energien auf mittlerem Niveau

  pypsa-de:
    reference_scenario: KN2045_Elek

  solving:
    constraints:
      limits_production_max:
        Link:
          H2 Electrolysis:
            DE:
              2035: 95
              2040: 145
              2045: 200
              2050: 200
      limits_volume_max:
        h2_derivate_import:
          DE:
            2030: 15
            2035: 70
            2040: 130
            2045: 200
            2050: 200
        h2_import:
          DE:
            2030: 10
            2035: 90
            2040: 170
            2045: 250
            2050: 250

  industry:
    steam_biomass_fraction: 0.4
    steam_hydrogen_fraction: 0.1
    steam_electricity_fraction: 0.5

KN2045_H2:
# Fokus stärker auf dem Hochlauf von Technologien zur indirekten Elektrifizierung der Sektoren
# Verstärkter Einsatz von Wasserstoff und synthetischen Kraftstoffen - erneuerbar erzeugt und auch importiert
# Direkte Elektrifizierung spielt dennoch wesentliche Rolle bei der Dekarbonisierung der Endenergie
# Ausbau der erneuerbaren Stromerzeugung erreicht politisch gesetzte Ziele

  pypsa-de:
    reference_scenario: KN2045_H2

  solving:
    constraints:
      limits_capacity_min:
        Link:
          H2 Electrolysis:
            DE:
              2035: 8
              2040: 20
              2045: 50
      limits_volume_max:
        # constrain electricity import in TWh
        electricity_import:
          DE:
            2030: 35
            2035: 50
            2040: 70
            2045: 100 # scenario guidelines
            2050: 100
        # constrain hydrogen import in TWh
        h2_import:
          DE:
            2030: 45 # scenario guidelines
            2035: 155
            2040: 265
            2045: 400 # scenario guidelines
            2050: 400
        # import of h2 derivatives in TWh
        h2_derivate_import:
          DE:
            2035: 150
            2040: 275
            2045: 400 # scenario guidelines
            2050: 400
      limits_production_max:
        Link:
          H2 Electrolysis:
            DE:
              2020: 0
              2025: 5
              2030: 45 # scenario guidelines
              2035: 160
              2040: 275
              2045: 400 # scenario guidelines
              2050: 400
      limits_production_min:
        Link:
          H2 Electrolysis:
            DE:
              2025: 0
              2030: 0
              2035: 0
              2040: 0
              2045: 200
              2050: 200
  industry:
    steam_biomass_fraction: 0.4
    steam_hydrogen_fraction: 0.5
    steam_electricity_fraction: 0.1

