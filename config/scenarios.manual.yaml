ExPol:
# UBA CO2 pathway instead of KSG targets
# Europen CO2 pathway fixed at 2030 for 2035-2050
# Kernnetz is not assumed to be built
# Not forcing renewables after 2030

  pypsa-de:
    reference_scenario: ExPol

  co2_budget_DE_source: UBA

  co2_budget:
    2030: 0.513
    2035: 0.429
    2040: 0.362
    2045: 0.311
    2050: 0.283

  costs:
    transmission: "underground" # either overhead line ("overhead") or underground cable ("underground")
  solving:
    constraints:
      limits_capacity_min:
        Generator:
          onwind:
            DE:
              2030: 86.5   # 75 % Wind-an-Land Law
          offwind:
            DE:
              2035: 29.3
          solar:
            DE:
              2030: 161.25   # 75 % PV strategy
      # boundary condition of maximum volumes
      limits_capacity_max:
        Generator:
          offwind:
            DE:
              2035: 40 # 29.3 + half of extra projects
          onwind:
            DE:
              2030: 94.5 # uba Projektionsbericht
          solar:
            DE:
              2030: 215 # uba Projektionsbericht
  sector:
    district_heating:
      potential: 0.1


KN2045_Mix:
# Default scenario, defined in pypsa.de.yaml
# Ausgewogener Mix an Technologien zur Dekarbonisierung der Sektoren
# Breites Energieträgerportfolio in der Endenergie (Strom, Wasserstoff, synthetische Kraftstoffe)
# Ausbau der erneuerbare Stromerzeugung erreicht politisch gesetzte Ziele
# Importe erneuerbar erzeugter Energien auf mittlerem Niveau
# dient als Referenzszenario in der Familie der Ariadne-Szenarien


# KN2045_Mix_LowDecentralDiscount:
#   costs:
#     custom_cost_fn: data/pypsa-de/custom_costs_nep_2023_low_decentral_discount.csv

KN2045_Mix_HDD_Upstream:
  costs:
    custom_cost_fn: data/pypsa-de/custom_costs_nep_2023_high_decentral_discount.csv
    
KN2045_Mix_endoH2retrofit:
  costs:
    custom_cost_fn: data/pypsa-de/custom_costs_nep_2023_high_decentral_discount.csv
endoretro:
  electricity:  
    H2_plants:
      enable: EU            # allowed values: false, DE, EU
      endogenous: true      # allowed values: true, false 
      start: 2030           # should be < force
      force: 2055           # force year after last planning horizon leads to no retrofitting of H2 plants
      cost_factor: 0.15     # repurposing cost of OCGT gas to H2 in % investment cost in EUR/MW source: Christidis et al (2023) - H2-Ready-Gaskraftwerke, Table 3 https://reiner-lemoine-institut.de/wp-content/uploads/2023/11/RLI-Studie-H2-ready_DE.pdf
      efficiency_loss: 0.05
endoretro_lowBiogas:
  electricity:  
    H2_plants:
      enable: EU            # allowed values: false, DE, EU
      endogenous: true      # allowed values: true, false 
      start: 2030           # should be < force
      force: 2055           # force year after last planning horizon leads to no retrofitting of H2 plants
      cost_factor: 0.15     # repurposing cost of OCGT gas to H2 in % investment cost in EUR/MW source: Christidis et al (2023) - H2-Ready-Gaskraftwerke, Table 3 https://reiner-lemoine-institut.de/wp-content/uploads/2023/11/RLI-Studie-H2-ready_DE.pdf
      efficiency_loss: 0.05
  sector:
    biogas_potential_factor: 3 # set to 3 to reduce biogas potentials to 1/3 of the original value, see prepare_sector_network.py
endoretro_high_GT_cost:
